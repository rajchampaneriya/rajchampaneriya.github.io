baseURL = 'https://next.rajc.work/'
languageCode = 'en-us'
title = 'rajc.work'
theme = 'frontier'
relativeURLs = true
canonifyURLs = false
buildFuture = true
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  description = "raj see dot work is the portfolio of Raj Champaneriya, a Forward Deployed Engineer who embeds with enterprise teams to turn ambiguous, high-stakes problems into production systems. Case studies, builds and points of view on legacy modernization, cloud-native platforms and applied AI."

  # Landing page audio (Listen button on home)
  landingAudioSrc = "/audio/landing.wav"
  landingAudioTitle = "Raj Champaneriya — Portfolio Overview"
  author = "Raj Champaneriya"
  mainSections = ["blog"]
  keywords = ["forward deployed engineer", "FDE", "applied AI", "Fortune 500 transformation", "legacy modernization", "cloud-native architecture", "solution architecture", "event-driven architecture", "system design", "CARE architecture method"]
  
  # Assets (Favicons)
  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "safari-pinned-tab.svg"
  
  # PaperMod settings
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Profile mode (for homepage)
  [params.profileMode]
    enabled = true
    title= "Raj Champaneriya"
    subtitle = "Forward Deployed Engineer: embedded with enterprise teams, from ambiguous brief to production"
    imageUrl = "images/profile.jpg"
    imageWidth = 140
    imageHeight = 140
    imageTitle = "Raj Champaneriya — Forward Deployed Engineer"
    buttons = [
      { name = "See the work", url = "/work/" },
      { name = "How I work", url = "/#care" }
    ]

  # Premium positioning (no employer/vendor branding — personal views only)
  [params.premium]
    headline = "Forward Deployed Engineer"
    tagline = "Embedded with enterprise teams, from ambiguous brief to production"
    experience = "13+ years across 4 Fortune 500 industries"
    methodology = "The CARE Architecture Method"
    methodologyParts = ["Clarity", "Alignment", "Reality", "Execution"]
    industries = ["Healthcare", "Property Insurance", "Media & Entertainment", "Logistics"]

    [[params.premium.metrics]]
      value = "99.95%"
      label = "Uptime SLA"
      icon = "uptime"
    [[params.premium.metrics]]
      value = "$8M+"
      label = "Modernization"
      icon = "dollar"
    [[params.premium.metrics]]
      value = "40%"
      label = "Cost Reduction"
      icon = "cost"
    [[params.premium.metrics]]
      value = "10K+"
      label = "AI Queries / Month"
      icon = "cost"


  # The CARE scroll story on the home page (layouts/partials/care-story.html).
  # Each step is one beat of the story: the copy scrolls past while the pinned
  # canvas animates to match. "CARE in the field" beats come from posts and
  # projects that carry a `story:` block in their front matter.
  [params.care]
    question = "How does an ambiguous, high-stakes brief become **a result you can measure**?"
    intro = "Four moves, in the same order on every engagement. Scroll to see each one, then the method at work in the field."
    outro = "That is CARE: a repeatable path from an unclear brief to a measured result."

    [[params.care.steps]]
      word = "Clarity"
      promise = "Decompose ambiguity into actionable decisions"
      detail = "Start with questions, not diagrams. Where is the operational risk, where are the seams, and what would count as success?"
    [[params.care.steps]]
      word = "Alignment"
      promise = "Map technical direction to business outcomes"
      detail = "Put the cost of every option on the table, so product, engineering, platform and delivery leaders back the same path."
    [[params.care.steps]]
      word = "Reality"
      promise = "Validate through prototypes & decision frameworks"
      detail = "Treat every assumption as a claim to test. Working software and evidence decide what scales, not opinion."
    [[params.care.steps]]
      word = "Execution"
      promise = "Deliver with zero critical defects"
      detail = "Ship in small, reversible slices, instrument each one, and expand only when the evidence supports the next step."

  # Social links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rajchampaneriya"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/rajchampaneriya"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:champaneriyaraj@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# Menu configuration
[menu]
  # One entry for everything a reader can open. Posts (/blog/...) and projects
  # (/projects/...) keep their own URLs but are listed together on /work/.
  [[menu.main]]
    identifier = "work"
    name = "Work"
    url = "/work/"
    weight = 10

  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 40

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Output formats
# llms.txt (https://llmstxt.org) — curated site map for AI agents;
# llms-full.txt — full text of every published page in one file.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "llmsfull"]

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true
