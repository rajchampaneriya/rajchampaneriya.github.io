baseURL = 'https://next.rajc.work/'
languageCode = 'en-us'
title = 'rajc.work'
theme = 'frontier'
relativeURLs = true
canonifyURLs = false
buildFuture = true
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  description = "raj see dot work is the portfolio of Raj Champaneriya, an Technical Solution Architect & Strategic Technology Leader. He shares views on high-stakes transformations, zero-downtime modernizations, and architecture that protects careers and accelerates change."

  # Landing page audio (Listen button on home)
  landingAudioSrc = "/audio/landing.wav"
  landingAudioTitle = "Raj Champaneriya — Portfolio Overview"
  author = "Raj Champaneriya"
  mainSections = ["blog"]
  keywords = ["technical solutions", "strategic technology leader", "Fortune 500 transformation", "legacy modernization", "cloud-native architecture", "solution architecture", "event-driven architecture", "system design", "CARE architecture method"]
  
  # Assets (Favicons)
  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "safari-pinned-tab.svg"
  
  # PaperMod settings
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Profile mode (for homepage)
  [params.profileMode]
    enabled = true
    title= "Raj Champaneriya"
    subtitle = "Technical Solution Architect That Protects Careers and Accelerates Transformations"
    imageUrl = "images/profile.jpg"
    imageWidth = 140
    imageHeight = 140
    imageTitle = "Raj Champaneriya — Technical Solution Architect & Strategic Technology Leader"
    buttons = [
      { name = "Architecture Blueprints", url = "/projects" },
      { name = "Strategic Insights", url = "/blog" }
    ]

  # Premium positioning (no employer/vendor branding — personal views only)
  [params.premium]
    headline = "Technical Solution Architect & Strategic Technology Leader"
    tagline = "Architecture that protects careers and accelerates transformations"
    experience = "13+ years across 4 Fortune 500 industries"
    methodology = "The CARE Architecture Method"
    methodologyParts = ["Clarity", "Alignment", "Reality", "Execution"]
    industries = ["Healthcare", "Property Insurance", "Media & Entertainment", "Logistics"]

    [[params.premium.metrics]]
      value = "99.95%"
      label = "Uptime SLA"
      icon = "uptime"
    [[params.premium.metrics]]
      value = "$8M+"
      label = "Modernization"
      icon = "dollar"
    [[params.premium.metrics]]
      value = "40%"
      label = "Cost Reduction"
      icon = "cost"
    [[params.premium.metrics]]
      value = "10K+"
      label = "AI Queries / Month"
      icon = "cost"


  # Social links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rajchampaneriya"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/rajchampaneriya"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:champaneriyaraj@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# Menu configuration
[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Insights"
    url = "/blog/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Architecture Blueprints"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 40

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Output formats
# llms.txt (https://llmstxt.org) — curated site map for AI agents;
# llms-full.txt — full text of every published page in one file.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms", "llmsfull"]

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true
